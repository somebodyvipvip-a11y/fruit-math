<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10以内加减法 · 水果练习生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFF9EC;
    color: #333;
    display: flex; flex-direction: column; align-items: center;
  }
  /* 顶部控制栏 */
  .toolbar {
    position: sticky; top: 0;
    width: 100%;
    background: #FFF3D4;
    border-bottom: 2px solid #F0C36D;
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    z-index: 10;
  }
  .toolbar label { font-size: 14px; font-weight: 700; color: #8a5a00; }
  .seg {
    display: inline-flex;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #F0A93B;
  }
  .seg button {
    border: none; background: #fff;
    padding: 8px 16px;
    font-size: 14px; font-weight: 700; color: #a06a00;
    cursor: pointer;
  }
  .seg button.on { background: #F0A93B; color: #fff; }
  .btn {
    border: none; border-radius: 20px;
    padding: 9px 18px;
    font-size: 14px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn-refresh { background: #E2363C; color: #fff; }
  .btn-print { background: #4A90E2; color: #fff; }
  .switch {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; color: #555; font-weight: 600;
  }
  .switch input { width: 16px; height: 16px; }
  .pg {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700; color: #8a5a00;
  }
  .pg input {
    width: 62px; padding: 7px 8px;
    font-size: 14px; font-weight: 700; color: #8a5a00;
    border: 2px solid #F0A93B; border-radius: 12px;
    background: #fff; text-align: center;
  }

  /* 页面 */
  #pages { width: 100%; }
  .page {
    width: 148mm;
    min-height: 210mm;
    margin: 0 auto;
    padding: 4mm 6mm 8mm;
    background: #fff;
  }
  .page + .page { margin-top: 14px; }
  .title { text-align: center; margin-bottom: 5mm; }
  .title h1 {
    font-size: 19pt; color: #E2363C; font-weight: 900;
    letter-spacing: 2px; text-shadow: 2px 2px 0 #FFD9D9;
  }
  .subtitle { text-align: center; font-size: 8.5pt; color: #888; }

  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3.5mm 4.5mm; margin-top: 1mm; }

  .qz {
    border-radius: 9px;
    border: 1.5px solid #F5D78F;
    background: #FDF6E3;
    padding: 1.5mm 2.5mm;
    height: 25.7mm;
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; gap: 0.4mm;
  }
  .c0 { border-color:#F5A623; } .c1 { border-color:#7ED321; }
  .c2 { border-color:#F78FB3; } .c3 { border-color:#4A90E2; }
  .c4 { border-color:#B084E0; }

  .fruits {
    font-size: 12pt; line-height: 1.25;
    height: 12mm; margin-bottom: 0.2mm; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    flex: none;
  }
  .fruits .op { font-size: 15pt; font-weight: 900; margin: 0 1mm; flex: none; }
  .op-plus { color: #E0412E; }
  .op-minus { color: #2E7DE0; }
  .addend {
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
    flex: none;
  }
  .row5 { display: flex; gap: 2px; flex: none; }
  .fruit { position: relative; display: inline-block; flex: none; }
  .fruit.del::after {
    content: ""; position: absolute; left: -10%; right: -10%; top: 48%;
    height: 4px; background: #E02222; transform: rotate(-20deg);
    border-radius: 2px;
  }

  .expr {
    display: flex; align-items: center; justify-content: center; gap: 1.5mm;
    font-size: 17pt; font-weight: 800; color: #333;
    height: 9.5mm; flex: none;
  }
  .expr .n { color: #C63D44; }
  .expr .m { color: #2E7DE0; }
  .expr .answer {
    display: inline-block;
    width: 11mm; height: 9.5mm; flex: none;
    border: 1.5px dashed #333; border-radius: 4px;
    background: #fff;
    line-height: 9mm; text-align: center;
    font-size: 14pt; color: #2c8a3a;
  }

  .page-num { text-align: right; font-size: 11pt; color: #999; margin-top: 6mm; }

  @page { size: A5 portrait; margin: 0; }
  @media print {
    .toolbar { display: none !important; }
    body { background: #fff; }
    .page { width: 148mm; padding: 4mm 6mm 6mm; }
    .qz { break-inside: avoid; }
    #pages .page + .page { break-before: page; page-break-before: always; margin-top: 0; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <label>题型：</label>
    <div class="seg" id="seg">
      <button data-mode="add" class="on">仅加法</button>
      <button data-mode="sub">仅减法</button>
      <button data-mode="mix">混合</button>
    </div>
    <button class="btn btn-refresh" id="refresh"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>换一批题目</button>
    <label class="pg">页数：
      <input type="number" id="pageNum" min="1" max="50" value="1"> 页
    </label>
    <button class="btn btn-print" id="printBtn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>打印</button>
    <label class="switch"><input type="checkbox" id="showAns"> 显示答案</label>
  </div>

  <div id="pages"></div>

<script>
const FRUITS = ['🍊','🍎','🍓','🍇','🍉','🍍','🍐','🍑','🍋','🫐'];
const COLORS = ['c0','c1','c2','c3','c4'];
let mode = 'add';
let showAns = false;

// 随机生成一道题，返回 {type, a, b, answer}
function genOne(m) {
  const type = m === 'mix' ? (Math.random() < 0.5 ? 'add' : 'sub') : m;
  if (type === 'add') {
    const a = randInt(1, 9), b = randInt(1, 10 - a);
    return { type, a, b, answer: a + b };
  } else {
    const a = randInt(1, 10), b = randInt(0, a);
    if (a === b && a === 0) return genOne(m);
    return { type, a, b, answer: a - b };
  }
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// 一题的水果示意区（HTML字符串）
function fruitsHtml(q, fruit) {
  const group = (count, makeFruit) => {
    let s = '<span class="addend">';
    for (let i = 0; i < count; i += 5) {
      const n = Math.min(5, count - i);
      let row = '<span class="row5">';
      for (let j = 0; j < n; j++) row += makeFruit(i + j);
      row += '</span>';
      s += row;
    }
    return s + '</span>';
  };
  if (q.type === 'add') {
    return group(q.a, () => '<span class="fruit">' + fruit + '</span>')
      + '<span class="op op-plus">+</span>'
      + group(q.b, () => '<span class="fruit">' + fruit + '</span>');
  } else {
    return group(q.a, i => i < q.b
      ? '<span class="fruit del">' + fruit + '</span>'
      : '<span class="fruit">' + fruit + '</span>');
  }
}

// 生成一页（结构、样式与原版单页完全一致，仅去掉页码）
function buildPage(title) {
  const page = document.createElement('div');
  page.className = 'page';
  page.innerHTML =
    '<div class="title">' +
      '<h1>' + title + '</h1>' +
      '<div class="subtitle">先数一数水果，再写出答案吧！🍓</div>' +
    '</div>' +
    '<div class="cols"></div>';

  const cols = page.querySelector('.cols');
  for (let idx = 0; idx < 12; idx++) {
    const q = genOne(mode);
    const fruit = FRUITS[idx % FRUITS.length];
    const colorCls = COLORS[idx % COLORS.length];
    const nCls = q.type === 'add' ? 'n' : 'm';
    const opSym = q.type === 'add' ? '+' : '−';
    const ans = showAns ? ('<span class="answer">' + q.answer + '</span>')
                        : '<span class="answer"></span>';
    const card = document.createElement('div');
    card.className = 'qz ' + colorCls;
    card.innerHTML =
      '<div class="fruits">' + fruitsHtml(q, fruit) + '</div>' +
      '<div class="expr"><span class="' + nCls + '">' + q.a + '</span>' +
      '<span>' + opSym + '</span>' +
      '<span class="' + nCls + '">' + q.b + '</span>' +
      '<span>=</span>' + ans + '</div>';
    cols.appendChild(card);
  }
  return page;
}

function render() {
  const pageCount = Math.min(50, Math.max(1, parseInt(document.getElementById('pageNum').value, 10) || 1));
  document.getElementById('pageNum').value = pageCount;

  const title = mode === 'add' ? '10以内的加法' : mode === 'sub' ? '10以内的减法' : '10以内的加减法';
  const pagesEl = document.getElementById('pages');
  pagesEl.innerHTML = '';

  for (let p = 0; p < pageCount; p++) {
    pagesEl.appendChild(buildPage(title));
  }
}

// 事件
document.getElementById('seg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === btn));
  render();
});
document.getElementById('refresh').addEventListener('click', render);
document.getElementById('pageNum').addEventListener('change', render);
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('showAns').addEventListener('change', e => {
  showAns = e.target.checked;
  render();
});

render();
</script>
</body>
</html>
